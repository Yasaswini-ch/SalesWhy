services:
  - type: web
    name: saleswhy
    runtime: python
    plan: standard  # 1 CPU / 2GB -- TabPFN + pandas + FastAPI together are tight on 512MB
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # set manually in the Render dashboard, never committed
      - key: PYTHON_VERSION
        value: 3.12.0
